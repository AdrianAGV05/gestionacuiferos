<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar datos de operador - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/sweetalert2@9.5.3/dist/sweetalert2.all.min.js"></script> 
    <script src="js/script.js" defer></script>
</head>
<body onload="cargardatos()">

  <div class="page-content">

    <header class="main-header">
      <a href="Menu_MAIN.html" class="logo-box" title="Ir al menú principal">
        <img src="img/iitca_logo.png" class="logo-img" alt="Logo IITCA">
      </a>
      
      <div class="header-actions">
        <a href="Menu_MAIN.html" class="nav-btn">
          <i class="fa-solid fa-house"></i>
          Inicio
        </a>
        <a href="index.html" class="nav-btn logout-link">
          <i class="fa-solid fa-right-from-bracket"></i>
          Salir
        </a>
      </div>
    </header>

    <h1 class="main-title">Modificar datos de operador</h1>

    <div class="panel">
      
      <div class="panel-header">
        <h2>Edición de parámetros</h2>
      </div>

      <div class="table-scroll">
        <table class="tabla">
          <colgroup>
            <col width="25%">
            <col width="30%">
            <col width="20%">
            <col width="25%">
          </colgroup>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo electrónico</th>
              <th>Contraseña</th>
              <th>Número de teléfono</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <input type="text" id="nombre" placeholder="Nombre completo" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; color: #004982; outline: none; background-color: white;">
              </td>
              <td>
                <input type="email" id="email" placeholder="ejemplo@correo.com" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; color: #004982; outline: none; background-color: white;">
              </td>
              <td>
                <!-- Se mantiene type="text" para visualizar la contraseña precargada como en tu archivo original -->
                <input type="text" id="pwd" placeholder="********" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; color: #004982; outline: none; background-color: white;">
              </td>
              <td>
                <input type="text" id="tel" placeholder="10 dígitos" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; color: #004982; outline: none; background-color: white;">
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="button-container1">
        <!-- Botón Regresar con estilo secundario -->
        <button class="btn" onclick="listadoOperadores()" id="backBtn" >
          <i class="fa-solid fa-arrow-left"></i> Regresar
        </button>
        <!-- Botón Guardar con estilo primario -->
        <button class="btn" onclick="modificacionoperador()" id="saveBtn">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
        </button>
      </div>

    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

</body>
</html>
