<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear nuevo usuario - XibalbaData</title>
    
    <link rel="stylesheet" href="CSS/Menu_MAIN.css">
    
    <script src="https://kit.fontawesome.com/7f2bc339d8.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <script src="js/script.js" defer></script>
</head>
<body>

  <div class="page-content">

    <header class="main-header">
      <a class="logo-box" title="Ir al menú principal">
        <img src="img/iitca_logo.png" class="logo-img" alt="Logo IITCA">
      </a>
      <a href="index.html" class="nav-btn">
        <i class="fa-solid fa-house"></i>
        Inicio
      </a>
    </header>

    <h1 class="main-title">Registro de personal</h1>

    <!-- Panel de cristal centrado -->
    <div class="panel" style="max-width: 850px; margin: 20px auto 40px auto;">
      
      <div class="panel-header" style="justify-content: center; margin-bottom: 30px;">
        <h2>Crear nuevo usuario</h2>
      </div>

      <!-- Formulario estructurado en CSS Grid (2 columnas) -->
      <form class="form-grid" id="registroForm" onsubmit="event.preventDefault(); crearcuenta();">
        
        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" name="matricula" required placeholder="Ej. 2020202">
        </div>

        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
        </div>

        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="email" required placeholder="ejemplo@dominio.com">
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contraseña" required placeholder="Ingresa contraseña">
        </div>

        <div class="form-group">
          <label for="telefono">Número de Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required placeholder="10 dígitos">
        </div>

        <div class="form-group">
          <label for="tipoUsuario">Rol de Usuario</label>
          <select id="tipoUsuario" name="tipoUsuario" required>
              <option value="administrador">Administrador</option>
              <option value="operador">Operador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="Acudd">Acuífero (Opcional)</label>
          <div class="input-with-action">
            <select id="Acudd" name="Acudd">
              <option value="">Seleccione un acuífero...</option>  
            </select>
            <a href="Captura_de_acuifero.html" class="action-btn" title="Agregar nuevo acuífero">
              <i class="fa-solid fa-circle-plus"></i>
            </a>
          </div>
        </div>

        <div class="form-group">
          <label for="oodd">Organismo Operador (Opcional)</label>
          <div class="input-with-action">
            <select id="oodd" name="oodd">
              <option value="">Seleccione un organismo...</option>
            </select>
            <a href="Captura_de_OP.html" class="action-btn" title="Agregar nuevo organismo">
              <i class="fa-solid fa-circle-plus"></i>
            </a>
          </div>
        </div>

      </form>

      <div class="button-container1" style="margin-top: 35px;">
        <button type="button" class="btn " onclick="window.history.back()" id="backBtn">
          <i class="fa-solid fa-arrow-left"></i> Cancelar
        </button>
        <button type="button" class="btn" onclick="crearcuenta()" id="saveBtn">
          <i class="fa-solid fa-user-check"></i> Crear Cuenta
        </button>
      </div>
        
    </div> <!-- /.panel -->

  </div> <!-- /.page-content -->

  <footer>
    <small>
      <i class="fa-regular fa-copyright"></i> 
      Software desarrollado por el Instituto Interamericano de Tecnología y Ciencias del Agua.
    </small>
  </footer>

  <!-- Scripts para cargar selects dinámicos -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Cargar Acuíferos
        fetch('http://localhost:8080/api/acuifero')
            .then(response => {
                if (!response.ok) return [];
                return response.json();
            })
            .then(data => {
                const Acudd = document.getElementById("Acudd");
                Acudd.innerHTML = '<option value="">Seleccione un acuífero (opcional)</option>'; 
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.acu_nombre;
                    option.textContent = item.acu_nombre;
                    Acudd.appendChild(option);
                });
            })
            .catch(() => {
                document.getElementById("Acudd").innerHTML = '<option value="">Sin datos de acuífero</option>';
            });

        // Cargar Organismos Operadores
        fetch('http://localhost:8080/api/oo')
            .then(response => {
                if (!response.ok) return [];
                return response.json();
            })
            .then(data => {
                const oodd = document.getElementById("oodd");
                oodd.innerHTML = '<option value="">Seleccione un organismo (opcional)</option>'; 
                data.forEach(item => {
                    const option = document.createElement("option");
                    option.value = item.oo_nombre;
                    option.textContent = item.oo_nombre;
                    oodd.appendChild(option);
                });
            })
            .catch(() => {
                document.getElementById("oodd").innerHTML = '<option value="">Sin datos de organismo</option>';
            });
    });
  </script>

</body>
</html>
